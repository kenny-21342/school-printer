[project]
name = "school-printer"
version = "0.1.0"
description = "Print relay API: iOS upload -> CUPS -> school FUJIFILM Xerox (bw)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    # The relay runs on a 2019 Intel iMac with no compiler installed, and the
    # newest releases of these two publish arm64-only macOS wheels — pip would
    # fall back to building from source and fail. The last versions that ship an
    # Intel wheel are pinned for that platform only; every other platform keeps
    # tracking the latest, so this does not hold back the security-sensitive one
    # anywhere it matters.
    'argon2-cffi-bindings<26; platform_system == "Darwin" and platform_machine == "x86_64"',
    'cryptography<49; platform_system == "Darwin" and platform_machine == "x86_64"',
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
