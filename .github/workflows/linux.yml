name: Linux
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real headless converter and shell checks
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress cups-ipp-utils avahi-utils shellcheck
      - run: python -m pip install -e './server[dev]'
      - run: python -m pytest server/tests -q
      - run: shellcheck deploy/deploy-linux.sh deploy/configure-queue-linux.sh tools/school-print-linux deploy/airprint-shim/print-job.sh
      - name: Check systemd units
        run: |
          mkdir -p /tmp/school-printer/data/airprint /tmp/school-printer/spool /tmp/school-printer/logs /tmp/school-printer/venv/bin /tmp/school-printer/airprint-shim
          ln -s "$(command -v python)" /tmp/school-printer/venv/bin/python
          for unit in deploy/linux/*.service; do
            sed 's|@INSTALL_DIR@|/tmp/school-printer|g' "$unit" > "/tmp/$(basename "$unit")"
          done
          systemd-analyze verify /tmp/school-printer.service /tmp/school-airprint.service
