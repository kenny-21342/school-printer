name: SchoolPrinter
options:
  bundleIdPrefix: com.kenny
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

targets:
  SchoolPrinter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SchoolPrinter
        excludes:
          - "Info.plist"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny.schoolprinter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SchoolPrinter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
